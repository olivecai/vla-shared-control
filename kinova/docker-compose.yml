version: "3.8"
services:
  kinova:
    container_name: vla_shared_control
    working_dir: /home/user/kinova
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    network_mode: host
    tty: true
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - ../kinova:/home/user/kinova
      - ../vla:/home/user/vla
      - ../kortex_teleop:/home/user/kortex_teleop
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev